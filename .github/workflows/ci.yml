name: MiniDC CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository_owner }}/minidc-server
  IMAGE_NAME_UI: ${{ github.repository_owner }}/minidc-ui
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: minidc
          POSTGRES_USER: minidc
          POSTGRES_PASSWORD: test
        ports: [5432, 5432]
        options: >-
          --health-cmd "pg_isready -U minidc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379, 6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven Tests (all modules)
        working-directory: .
        run: |
          ./mvn.cmd clean test -B --no-transfer-progress

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  frontend-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: minidc-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: minidc-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_WS_BASE_URL: ws://localhost:8080
          VITE_GUACAMOLE_BASE_URL: http://localhost:8081

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: minidc-ui/dist/
          retention-days: 7

  docker-build:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: minidc-server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata for UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: minidc-ui/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM for server
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:${{ steps.meta-server.outputs.tags }}
          format: spdx-json
          output-file: sbom-server.spdx.json

      - name: Generate SBOM for UI
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:${{ steps.meta-ui.outputs.tags }}
          format: spdx-json
          output-file: sbom-ui.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.spdx.json

  helm-verify:
    name: Helm Lint & Template
    needs: [backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          cd deploy/helm/minidc
          helm dependency build

      - name: Helm lint
        run: |
          cd deploy/helm/minidc
          helm lint .

      - name: Helm template dry-run
        run: |
          cd deploy/helm/minidc
          helm template test-release . \
            --set postgresql.auth.password=test \
            --set server.env.MINIDC_JWT_SECRET=test-test-test-test-test-test-32 \
            --set server.env.MINIDC_DATA_KEY=Y2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtMzI= \
            --set server.env.MINIDC_GUAC_SECRET=00112233445566778899aabbccddeeff \
            --set kafka.enabled=false \
            --set redis.auth.enabled=false \
            > /dev/null

  security-scan:
    name: Security Scan
    needs: [docker-build]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}:latest
          format: sarif
          output: trivy-server.sarif
          severity: HIGH,CRITICAL

      - name: Run Trivy vulnerability scanner (UI)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_UI }}:latest
          format: sarif
          output: trivy-ui.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-server.sarif
          category: container-server

      - name: Upload Trivy results to GitHub Security (UI)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-ui.sarif
          category: container-ui

  release:
    name: Create Release
    needs: [docker-build, helm-verify, security-scan]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"

      - name: Update release notes
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.release.tag_name
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: release.data.body + '\n\n## Docker Images\n```bash\ndocker pull ghcr.io/${{ github.repository_owner }}/minidc-server:${{ github.event.release.tag_name }}\ndocker pull ghcr.io/${{ github.repository_owner }}/minidc-ui:${{ github.event.release.tag_name }}\n```\n\n## Helm Chart\n```bash\nhelm repo add minidc https://${{ github.repository_owner }}.github.io/miniDC\nhelm install minidc minidc/minidc --version ${{ github.event.release.tag_name }}\n```'
            })

  summary:
    name: Pipeline Summary
    needs: [backend-test, frontend-test, docker-build, helm-verify, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job statuses
        run: |
          echo "Backend Tests: ${{ needs.backend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-test.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Helm Verify: ${{ needs.helm-verify.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"

      - name: Fail if any required job failed
        if: >
          needs.backend-test.result != 'success' ||
          needs.frontend-test.result != 'success' ||
          needs.helm-verify.result != 'success'
        run: exit 1
