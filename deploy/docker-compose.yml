version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minidc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minidc
      POSTGRES_USER: minidc
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  guacd:
    image: guacamole/guacd:latest
    container_name: minidc-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"

  guacamole:
    image: guacamole/guacamole:latest
    container_name: minidc-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
    ports:
      # Mapped to host port 8081 to avoid clashing with minidc-server dev port 8080
      - "8081:8080"
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      # NOTE: Verify exact environment variable syntax against guacamole-auth-json documentation
      JSON_SECRET_KEY: "00112233445566778899aabbccddeeff"
      EXTENSIONS: "auth-json"

volumes:
  pgdata:

