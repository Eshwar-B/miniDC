# MiniDC Platform - Production Values
# Usage: helm install minidc ./deploy/helm/minidc -f deploy/helm/minidc/values.yaml

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  # Override for custom registry:
  # imageRegistry: my-registry.example.com
  # imagePullSecrets:
  #   - name: regcred

# PostgreSQL Configuration
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: minidc
    username: minidc
    # password: "change-me"  # Set via secret or --set postgresql.auth.password=...
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
  service:
    ports:
      postgresql: 5432
    type: ClusterIP

# Redis Configuration
redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  auth:
    enabled: false
    # password: "change-me"
    existingSecret: ""
  master:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
  service:
    ports:
      redis: 6379

# Kafka Configuration (using Strimzi operator is recommended for production)
# This is a simplified single-broker for development
kafka:
  enabled: true
  image:
    registry: docker.io
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
  config:
    num.partitions: 3
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    auto.create.topics.enable: "true"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  zookeeper:
    enabled: false  # Using KRaft mode
  kraft:
    enabled: true
    controller:
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
    broker:
      replicas: 1
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 1Gi

# Apache Guacamole Configuration
guacamole:
  enabled: true
  guacd:
    image:
      registry: docker.io
      repository: guacamole/guacd
      tag: "1.5.5"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  guacamole:
    image:
      registry: docker.io
      repository: guacamole/guacamole
      tag: "1.5.5"
      pullPolicy: IfNotPresent
    extensions:
      - auth-json
    jsonSecretKey: "00112233445566778899aabbccddeeff"  # Override in production!
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    service:
      type: ClusterIP
      port: 8080
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/websocket-services: "guacamole"
    hosts:
      - host: guacamole.minidc.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: guacamole-tls
        hosts:
          - guacamole.minidc.example.com

# MiniDC Server Configuration
server:
  enabled: true
  replicaCount: 2
  image:
    registry: ghcr.io
    repository: eshwar-b/minidc-server
    tag: "latest"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/websocket-services: "minidc-server"
    hosts:
      - host: api.minidc.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: minidc-server-tls
        hosts:
          - api.minidc.example.com
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
        selectPolicy: Max
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  env:
    SPRING_PROFILES_ACTIVE: "prod"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/minidc"
    SPRING_DATA_REDIS_HOST: "{{ .Release.Name }}-redis-master"
    SPRING_DATA_REDIS_PORT: "6379"
    KAFKA_BOOTSTRAP_SERVERS: "{{ .Release.Name }}-kafka:9092"
    MINIDC_KAFKA_ENABLED: "true"
    MINIDC_GUAC_BASE_URL: "http://{{ .Release.Name }}-guacamole:8080/guacamole"
    MINIDC_GUAC_SECRET: "00112233445566778899aabbccddeeff"  # Override!
    MINIDC_JWT_SECRET: "change-me-change-me-change-me-32"   # Override!
    MINIDC_DATA_KEY: "Y2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtMzI="  # Override!
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
    MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
    MANAGEMENT_OTEL_TRACES_EXPORTER: "otlp"
    MANAGEMENT_OTEL_METRICS_EXPORTER: "prometheus"
    MANAGEMENT_OTEL_EXPORTER_OTLP_ENDPOINT: "http://{{ .Release.Name }}-otel-collector:4317"
  envFrom:
    - secretRef:
        name: "{{ .Release.Name }}-minidc-secrets"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"

# MiniDC UI Configuration
ui:
  enabled: true
  replicaCount: 2
  image:
    registry: ghcr.io
    repository: eshwar-b/minidc-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: app.minidc.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: minidc-ui-tls
        hosts:
          - app.minidc.example.com
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    VITE_API_BASE_URL: "https://api.minidc.example.com"
    VITE_WS_BASE_URL: "wss://api.minidc.example.com"
    VITE_GUACAMOLE_BASE_URL: "https://guacamole.minidc.example.com"

# OpenTelemetry Collector
otelCollector:
  enabled: true
  image:
    registry: docker.io
    repository: otel/opentelemetry-collector-contrib
    tag: "0.106.0"
    pullPolicy: IfNotPresent
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'minidc-server'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node: "true"
          namespace: "true"
          pod: "true"
          container: "true"
    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      otlp:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      logging:
        loglevel: info
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes]
          exporters: [otlp, logging]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, memory_limiter, k8sattributes]
          exporters: [prometheus, logging]
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    ports:
      otlp-grpc: 4317
      otlp-http: 4318
      prometheus: 8889

# Prometheus Operator (for ServiceMonitor)
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    selector:
      release: prometheus

# Grafana Dashboards
grafana:
  enabled: true
  dashboards:
    enabled: true
    namespace: monitoring
    label: grafana_dashboard
  dashboardsConfigMaps:
    minidc-overview:
      name: minidc-overview
      file: minidc-overview.json
    minidc-telemetry:
      name: minidc-telemetry
      file: minidc-telemetry.json
    minidc-financial:
      name: minidc-financial
      file: minidc-financial.json

# Network Policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: minidc-server
      ports:
        - protocol: TCP
          port: 8080

# Pod Disruption Budgets
pdb:
  enabled: true
  server:
    minAvailable: 1
  ui:
    minAvailable: 1

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Service Accounts
serviceAccount:
  create: true
  name: ""
  annotations: {}

# TLS Certificates (cert-manager)
certManager:
  enabled: true
  clusterIssuer: "letsencrypt-prod"
  email: "admin@minidc.example.com"