{{- if .Values.pdb.enabled }}
{{- if .Values.server.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "minidc.fullname" . }}-server
  labels:
    {{- include "minidc.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  minAvailable: {{ .Values.pdb.server.minAvailable }}
  selector:
    matchLabels:
      {{- include "minidc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "minidc.fullname" . }}-ui
  labels:
    {{- include "minidc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  minAvailable: {{ .Values.pdb.ui.minAvailable }}
  selector:
    matchLabels:
      {{- include "minidc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
{{- end }}
{{- end }}
