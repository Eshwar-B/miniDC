{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minidc.fullname" . }}-server
  labels:
    {{- include "minidc.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.server.service.targetPort }}
      targetPort: ws-agent
      protocol: TCP
      name: ws-agent
  selector:
    {{- include "minidc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}
