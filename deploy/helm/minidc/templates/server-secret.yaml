{{- if .Values.server.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minidc.secretName" . }}
  labels:
    {{- include "minidc.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  MINIDC_JWT_SECRET: {{ .Values.server.env.MINIDC_JWT_SECRET }}
  MINIDC_DATA_KEY: {{ .Values.server.env.MINIDC_DATA_KEY }}
  MINIDC_GUAC_SECRET: {{ .Values.server.env.MINIDC_GUAC_SECRET }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default "change-me" }}
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password }}
  {{- end }}
{{- end }}
