server:
  port: 8443
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/minidc
    username: minidc
    password: change-me
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: minidc-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
minidc:
  jwt-secret: ${MINIDC_JWT_SECRET:change-me-change-me-change-me-32}
  jwt-hours: 12
  data-key: ${MINIDC_DATA_KEY:Y2hhbmdlLW1lLWNoYW5nZS1tZS1jaGFuZ2UtbWUtMzI=}
  guac-base-url: http://localhost:8080/guacamole
  guac-json-secret: ${MINIDC_GUAC_SECRET:00112233445566778899aabbccddeeff}
  max-active-leases-per-user: 1
  redis:
    enabled: ${MINIDC_REDIS_ENABLED:true}
  rate-limit:
    enabled: ${MINIDC_RATE_LIMIT_ENABLED:true}
    login-limit-per-minute: 5
    register-limit-per-minute: 3
    lease-limit-per-minute: 10
  kafka:
    enabled: ${MINIDC_KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    dlq-topic: minidc.dlq
